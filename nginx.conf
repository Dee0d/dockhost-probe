server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Логи — в stdout/stderr, чтобы они были видны в разделе «Логи» Dockhost
    access_log /dev/stdout;
    error_log  /dev/stderr;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # Проба живости — Dockhost/healthcheck дергает этот адрес
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Хешированные ассеты можно кешировать навсегда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кешируем, иначе пользователи увидят старую версию
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA-фоллбэк: любой маршрут отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
